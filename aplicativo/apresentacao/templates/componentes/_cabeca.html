<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  }

  @layer components {
    .cartao {
      @apply rounded-md bg-white p-5 shadow-lg shadow-blue-950/10 ring-1 ring-slate-200;
    }
    .cartao-interativo {
      @apply cursor-pointer transition duration-200 ease-out hover:-translate-y-1 hover:scale-[1.03] hover:shadow-2xl hover:shadow-blue-950/20 hover:ring-blue-300;
    }
    .botao {
      @apply inline-flex items-center justify-center gap-2 rounded-md px-5 py-3 text-sm font-bold shadow-md transition duration-200 ease-out hover:scale-105 hover:shadow-xl active:scale-95 disabled:pointer-events-none disabled:opacity-50;
    }
    .botao-primario {
      @apply bg-blue-700 text-white shadow-blue-900/30 hover:bg-blue-800;
    }
    .botao-destaque {
      @apply bg-yellow-400 text-blue-950 shadow-yellow-700/30 hover:bg-yellow-300;
    }
    .botao-sucesso {
      @apply bg-emerald-600 text-white shadow-emerald-900/30 hover:bg-emerald-700;
    }
    .botao-contorno {
      @apply bg-white text-blue-800 ring-2 ring-blue-700 hover:bg-blue-50;
    }
    .rotulo {
      @apply block text-sm font-semibold text-slate-700;
    }
    .campo {
      @apply mt-1 w-full rounded-md border-2 border-slate-200 bg-white px-3 py-2.5 shadow-inner transition focus:border-blue-600 focus:ring-4 focus:ring-yellow-300/60 focus:outline-none;
    }
    .selo {
      @apply inline-flex items-center gap-1 rounded-sm px-2 py-0.5 text-xs font-bold tracking-wide uppercase;
    }
    .selo-azul {
      @apply bg-blue-100 text-blue-800;
    }
    .selo-amarelo {
      @apply bg-yellow-200 text-yellow-900;
    }
    .selo-verde {
      @apply bg-emerald-100 text-emerald-800;
    }
    .selo-vermelho {
      @apply bg-rose-100 text-rose-800;
    }
    .selo-cinza {
      @apply bg-slate-100 text-slate-600;
    }
    .titulo-secao {
      @apply text-lg font-extrabold text-blue-950;
    }
    .opcao-selecionavel {
      @apply flex cursor-pointer items-center justify-between gap-3 rounded-md border-2 p-4 shadow-sm transition duration-200 hover:scale-[1.02] hover:shadow-lg;
    }
  }
</style>
<style>[x-cloak] { display: none !important; }</style>
